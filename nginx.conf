server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate static files so old scripts/HTML cannot persist.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # Avoid emitting deprecated/experimental policy features not supported by browsers.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
